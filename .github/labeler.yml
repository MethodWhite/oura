# Auto-label PRs by changed files (actions/labeler v5 syntax)
feat:
- changed-files:
  - any-glob-to-any-file:
    - src/**/*.rs
    - Cargo.toml

fix:
- changed-files:
  - any-glob-to-any-file:
    - src/**/*.rs

docs:
- changed-files:
  - any-glob-to-any-file:
    - '**/*.md'
    - '**/docs/**'

ci:
- changed-files:
  - any-glob-to-any-file:
    - .github/workflows/**/*
    - .github/**/*

config:
- changed-files:
  - any-glob-to-any-file:
    - 'opencode.json'
    - 'opencode.jsonc'
    - '**/opencode*'

test:
- changed-files:
  - any-glob-to-any-file:
    - tests/**/*